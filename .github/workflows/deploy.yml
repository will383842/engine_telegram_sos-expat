name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 12m
          script: |
            set -e
            cd /opt/engine-telegram

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Rebuild and restart containers
            docker compose build app queue scheduler
            docker compose up -d --force-recreate app queue scheduler nginx

            # Clear Laravel caches
            docker exec tg-app php artisan optimize:clear
            docker exec tg-app php artisan optimize

            # Run migrations if any
            docker exec tg-app php artisan migrate --force

            echo "Deploy complete: $(date)"
